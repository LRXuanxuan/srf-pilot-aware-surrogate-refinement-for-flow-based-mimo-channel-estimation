name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package and test dependencies
        run: |
          pip install -e ".[dev]" h5py hdf5storage

      - name: Compile all Python sources
        run: python -m compileall -q src scripts tests data_generation/prepare_srf_mat.py

      - name: Run smoke tests
        run: pytest -q

      - name: End-to-end smoke test (synthetic data, CPU)
        run: |
          python scripts/generate_synthetic_data.py --output-dir data/synthetic \
            --num-rx 8 --num-tx 16 --n-train 8 --n-val 4 --n-test 4
          python scripts/train.py --config configs/smoke_test.yaml \
            --epochs 1 --batch-size 4 --output-dir outputs/ci_smoke
          python scripts/evaluate.py --config configs/smoke_test.yaml \
            --checkpoint outputs/ci_smoke/best_model.pt \
            --samplers srf_p srf --max-batches 1 --device cpu
